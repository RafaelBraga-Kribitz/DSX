# README Quality Gate — drop this file into .github/workflows/ of a portfolio repository.
# Runs in ~10 s: clones the contract repo, installs PyYAML + Pillow + fontTools, audits this repository's README.
# Fails the check only when a required requirement FAILs (exit 1). BLOCKED_HUMAN (exit 2) and WARN do not fail CI.
#
# Owner-only job. It is not part of dsx's own verification (that is ci.yml /
# scripts/check.sh) and nothing in this repository backs it:
#   - It checks out RafaelBraga-Kribitz/braga-portfolio-docs, the README owner's
#     portfolio contract repo, and runs its readme_quality package. The job can
#     only pass where that repo is readable, so it is expected to fail on forks.
#   - Until the contract's readme-quality-gate branch is merged, the step below
#     falls back to that branch when main has no readme_quality package. When
#     the branch merges (or is deleted) the job follows main without any change
#     here. There is no commit pin, because this repository cannot see the
#     contract repo's history to choose one.
#   - Exit 2 (BLOCKED_HUMAN) is a warning, not a failure: it means a requirement
#     needs a person's judgement (a screenshot, a claim only the owner can
#     confirm), which no CI run can supply. Only a hard FAIL (exit 1) goes red.
name: README quality gate

on:
  pull_request:
    paths: ["README.md", "LICENSE*", "docs/assets/**", ".github/workflows/readme-quality.yml"]
  push:
    branches: [main, master]
    paths: ["README.md", "LICENSE*", "docs/assets/**"]
  workflow_dispatch:

jobs:
  readme-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: RafaelBraga-Kribitz/braga-portfolio-docs
          path: contract
          fetch-depth: 0
      - name: Use the gate branch until it is merged into main
        working-directory: contract
        run: |
          if [ ! -d readme_quality ] && git show-ref --verify --quiet refs/remotes/origin/readme-quality-gate; then
            git checkout -q readme-quality-gate
          fi
          test -d readme_quality || { echo "::error::contract repo has no readme_quality package"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml pillow fonttools
      - name: Audit README against the portfolio contract
        working-directory: contract
        shell: bash {0}
        run: |
          python -m readme_quality audit --repo "$GITHUB_WORKSPACE/repo" --verbose
          code=$?
          case "$code" in
            0) echo "README passes the portfolio contract" ;;
            2) echo "::warning::README is BLOCKED_HUMAN on at least one requirement (see log)" ;;
            *) echo "::error::README fails the portfolio contract"; exit 1 ;;
          esac
