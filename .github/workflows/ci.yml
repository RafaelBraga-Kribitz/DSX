# Project CI for dsx itself: ruff, markdownlint, unit tests, catalogue
# freshness, manifest conformance, the good/bad fixture contract, determinism,
# and hook syntax. All of it is scripts/check.sh — the same command a
# contributor runs locally. check.sh skips a linter that is not installed, so
# the linters are installed here explicitly; a gate that silently skips is not
# a gate.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned on purpose. check.sh skips a linter that is absent, so CI installs
      # them — but an unpinned install makes the lint gate non-reproducible: a new
      # ruff release can turn this job red with no change to the code, which is
      # exactly what happened on 2026-09-18 when 0.16.x added ISC004. Bumping
      # these is a deliberate commit that may surface new findings.
      - name: Install the linters check.sh runs when present
        run: |
          pip install -q ruff==0.16.8
          npm install -g --silent markdownlint-cli2@0.23.2
      - name: Full check
        run: ./scripts/check.sh
