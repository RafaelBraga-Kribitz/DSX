# Project CI for dsx itself: ruff, markdownlint, unit tests, catalogue
# freshness, manifest conformance, the good/bad fixture contract, determinism,
# and hook syntax. All of it is scripts/check.sh — the same command a
# contributor runs locally. check.sh skips a linter that is not installed, so
# the linters are installed here explicitly; a gate that silently skips is not
# a gate.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the linters check.sh runs when present
        run: |
          pip install -q ruff
          npm install -g --silent markdownlint-cli2
      - name: Full check
        run: ./scripts/check.sh
